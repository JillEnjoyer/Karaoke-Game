<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Godot Image Viewer</title>
</head>
<body>
    <h2>Godot Image Receiver</h2>
    <canvas id="canvas" width="640" height="360"></canvas>

    <script>
        ws.onmessage = function(event) {
            const blob = new Blob([event.data], { type: 'image/png' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            
            img.onload = function() {
                // Setting up canvas
                canvas.width = img.width;
                canvas.height = img.height;
                
                // Loading image into ImageData
                ctx.drawImage(img, 0, 0);
    
                // get image data from canvas
                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
                if (previousImageData) {
                    // compare with previous image data and update only changed pixels
                    for (let i = 0; i < imageData.data.length; i += 4) {
                        const r = imageData.data[i];
                        const g = imageData.data[i + 1];
                        const b = imageData.data[i + 2];
                        const a = imageData.data[i + 3];
    
                        // if pixel is not empty and has changed
                        if (r !== previousImageData.data[i] || g !== previousImageData.data[i + 1] || b !== previousImageData.data[i + 2] || a !== previousImageData.data[i + 3]) {
                            imageData.data[i] = r;
                            imageData.data[i + 1] = g;
                            imageData.data[i + 2] = b;
                            imageData.data[i + 3] = a;
                        }
                    }
                }
    
                // update canvas
                ctx.putImageData(imageData, 0, 0);
    
                // Send acknowledgment to server
                ws.send("received");
                // Store current image data for next comparison
                previousImageData = imageData;
            };
            
            img.src = url;
        };
    </script>
</body>
</html>
